83</span><br><span class="line">184</span><br><span class="line">185</span><br><span class="line">186</span><br><span class="line">187</span><br><span class="line">188</span><br><span class="line">189</span><br><span class="line">190</span><br><span class="line">191</span><br><span class="line">192</span><br><span class="line">193</span><br><span class="line">194</span><br><span class="line">195</span><br><span class="line">196</span><br><span class="line">197</span><br><span class="line">198</span><br><span class="line">199</span><br><span class="line">200</span><br><span class="line">201</span><br><span class="line">202</span><br><span class="line">203</span><br><span class="line">204</span><br><span class="line">205</span><br><span class="line">206</span><br><span class="line">207</span><br><span class="line">208</span><br><span class="line">209</span><br><span class="line">210</span><br><span class="line">211</span><br><span class="line">212</span><br><span class="line">213</span><br><span class="line">214</span><br><span class="line">215</span><br><span class="line">216</span><br><span class="line">217</span><br><span class="line">218</span><br><span class="line">219</span><br><span class="line">220</span><br><span class="line">221</span><br><span class="line">222</span><br><span class="line">223</span><br></pre></td><td class="code"><pre><code class="hljs bash">┌──────────────────────────────────────────────────────────┐<br>│  原生 GUI 方案 (性能最优)                                 │<br>├──────────────────────────────────────────────────────────┤<br>│  渲染引擎           │  UI 框架          │  代表作品       │<br>├──────────────────────────────────────────────────────────┤<br>│  OpenGL/DirectX     │  自写/Dear ImGui  │  游戏/工具      │<br>│  Skia               │  自写             │  Chrome/Flutter │<br>│  Direct2D           │  Win32 API        │  Windows 应用   │<br>│  Core Graphics      │  Cocoa            │  macOS 应用     │<br>│  自绘引擎           │  完全自写         │  Tsoding 风格   │<br>└──────────────────────────────────────────────────────────┘<br>示例架构<br>┌─────────────────────────────────────────────────────────┐<br>│                    你的 Markdown 编辑器                   │<br>├─────────────────────────────────────────────────────────┤<br>│  C/C++ 代码                                              │<br>│  ├── 文本渲染 (FreeType/HarfBuzz)                       │<br>│  ├── Markdown 解析 (cmark/自写)                          │<br>│  ├── 图形绘制 (OpenGL/Direct2D/Skia)                    │<br>│  ├── 窗口管理 (GLFW/SDL/原生 API)                       │<br>│  └── 输入处理 (键盘/鼠标/IME)                           │<br>├─────────────────────────────────────────────────────────┤<br>│  操作系统 API                                            │<br>└─────────────────────────────────────────────────────────┘<br>Tsoding 相关项目<br>https://github.com/tsoding/notepad<br>https://github.com/tsoding/microfrontends<br>特点：<br>- 几万行 C 代码<br>- 直接调用 Win32 API / X11<br>- 自己实现文本渲染、布局<br>- 无依赖，二进制几 KB 到几 MB<br>窗口程序的渲染层次<br>┌─────────────────────────────────────────────────────────────────┐<br>│                    应用 GUI 渲染层级                             │<br>├─────────────────────────────────────────────────────────────────┤<br>│                                                                 │<br>│  你的应用代码                                                   │<br>│       ↓                                                         │<br>│  UI 框架 (WPF/Avalonia/Qt/自写)                                 │<br>│       ↓                                                         │<br>│  渲染引擎 (DirectX/OpenGL/Skia/Core Graphics/GDI)              │<br>│       ↓                                                         │<br>│  图形驱动 (GPU Driver)                                          │<br>│       ↓                                                         │<br>│  GPU 硬件                                                       │<br>│                                                                 │<br>└─────────────────────────────────────────────────────────────────┘<br>---<br>各框架的渲染方式对比<br>WPF (Windows Presentation Foundation)<br>┌─────────────────────────────────────────────────────────┐<br>│  WPF 渲染架构                                            │<br>├─────────────────────────────────────────────────────────┤<br>│  XAML → 视觉树 → 渲染树 → DirectX 9 → GPU              │<br>│                                                         │<br>│  特点：                                                  │<br>│  - 基于 DirectX 9 (不是 GDI)                            │<br>│  - 有保留模式 (Retained Mode) 渲染                     │<br>│  - 自动处理重绘、动画、变换                            │<br>│  - 不能直接用 GDI 混合绘制                             │<br>└─────────────────────────────────────────────────────────┘<br>// WPF - 你声明 UI，框架负责渲染<br>&lt;StackPanel&gt;<br>    &lt;Button Content=<span class="hljs-string">&quot;Click Me&quot;</span> /&gt;<br>    &lt;TextBlock Text=<span class="hljs-string">&quot;Hello&quot;</span> /&gt;<br>&lt;/StackPanel&gt;<br>// 底层：WPF 把这些转换为 DirectX 调用<br>---<br>Avalonia<br>┌─────────────────────────────────────────────────────────┐<br>│  Avalonia 渲染架构                                       │<br>├─────────────────────────────────────────────────────────┤<br>│  Avalonia 自研渲染引擎                                   │<br>│  ├─ 跨平台抽象层                                         │<br>│  ├─ 支持 DirectX / OpenGL / Metal                       │<br>│  └─ 也可软件渲染 (CPU)                                  │<br>│                                                         │<br>│  特点：                                                  │<br>│  - 类似 WPF 但跨平台                                     │<br>│  - 即时模式 (Immediate Mode) 渲染                       │<br>│  - Skia 作为可选后端                                     │<br>└─────────────────────────────────────────────────────────┘<br>---<br>Qt<br>┌─────────────────────────────────────────────────────────┐<br>│  Qt 渲染架构                                             │<br>├─────────────────────────────────────────────────────────┤<br>│  QPainter → 后端抽象                                     │<br>│  ├─ Windows: Direct2D / OpenGL / GDI                   │<br>│  ├─ macOS: Core Graphics / Metal                       │<br>│  ├─ Linux: X11 / Wayland / OpenGL                      │<br>│  └─ 软件渲染 (Raster)                                   │<br>│                                                         │<br>│  Qt Quick: 基于场景图 + OpenGL/DirectX                 │<br>└─────────────────────────────────────────────────────────┘<br>---<br>自绘引擎 (Tsoding 风格)<br>┌─────────────────────────────────────────────────────────┐<br>│  自绘引擎架构                                            │<br>├─────────────────────────────────────────────────────────┤<br>│  你的代码 → 直接调用图形 API → GPU                     │<br>│                                                         │<br>│  可选路径：                                              │<br>│  ├─ Win32 API + GDI (最简单，CPU 渲染)                  │<br>│  ├─ Win32 API + Direct2D (现代，硬件加速)              │<br>│  ├─ Win32 API + OpenGL (跨平台，硬件加速)              │<br>│  ├─ Win32 API + DirectX 11/12 (Windows 专属)           │<br>│  └─ 纯 framebuffer + 自己画像素 (最底层)               │<br>│                                                         │<br>│  特点：                                                  │<br>│  - 无中间层，性能最优                                    │<br>│  - 所有逻辑自己实现 (文本/布局/事件)                   │<br>│  - 开发成本最高                                          │<br>└─────────────────────────────────────────────────────────┘<br>---<br>关键概念辨析<br>保留模式 vs 即时模式<br>┌──────────────────────────────────────────────────────────┐<br>│  保留模式 (Retained Mode) - WPF/Silverlight             │<br>├──────────────────────────────────────────────────────────┤<br>│  你：创建对象树 (Button, TextBlock...)                   │<br>│  框架：维护场景图，自动处理重绘                          │<br>│                                                         │<br>│  优点：开发简单，自动优化                                │<br>│  缺点：黑箱，难以精细控制                                │<br>└──────────────────────────────────────────────────────────┘<br>┌──────────────────────────────────────────────────────────┐<br>│  即时模式 (Immediate Mode) - OpenGL/自绘                │<br>├──────────────────────────────────────────────────────────┤<br>│  你：每帧手动绘制一切                                     │<br>│  框架：只负责执行你的绘制命令                            │<br>│                                                         │<br>│  优点：完全控制，性能可优化                              │<br>│  缺点：每帧都要重绘，代码量大                            │<br>└──────────────────────────────────────────────────────────┘<br>// 保留模式 (WPF)<br>&lt;Button Content=<span class="hljs-string">&quot;Click&quot;</span> /&gt;  // 创建后不用管，框架自动重绘<br>// 即时模式 (OpenGL)<br><span class="hljs-keyword">while</span> (running) &#123;<br>    glClear(GL_COLOR_BUFFER_BIT);<br>    drawButton(x, y, w, h, <span class="hljs-string">&quot;Click&quot;</span>);  // 每帧手动绘制<br>    swapBuffers();<br>&#125;<br>---<br>常见 GUI 框架的渲染后端<br>框架	默认渲染后端<br>WPF	DirectX 9<br>Avalonia	Skia/DirectX<br>Qt Widgets	GDI/Direct2D<br>Qt Quick	OpenGL<br>WinForms	GDI<br>WinUI 3	Direct2D<br>Electron	Chromium (Skia+OpenGL)<br>Dear ImGui	OpenGL/DirectX<br>自绘	任意选择<br>---<br>自绘引擎的真实代码示例<br>Tsoding 风格 (Win32 + GDI)<br>// 完全自绘，无 UI 框架<br><span class="hljs-comment">#include &lt;windows.h&gt;</span><br>void draw_button(HDC hdc, int x, int y, int w, int h, const char* text) &#123;<br>    // 自己画矩形<br>    RECT rect = &#123;x, y, x+w, y+h&#125;;<br>    FillRect(hdc, &amp;rect, (HBRUSH)GetStockObject(GRAY_BRUSH));<br>    FrameRect(hdc, &amp;rect, (HBRUSH)GetStockObject(BLACK_BRUSH));<br>    <br>    // 自己画文字<br>    TextOut(hdc, x+5, y+5, text, strlen(text));<br>&#125;<br>LRESULT CALLBACK WndProc(HWND hwnd, UINT msg, WPARAM wParam, LPARAM lParam) &#123;<br>    <span class="hljs-keyword">case</span> WM_PAINT: &#123;<br>        PAINTSTRUCT ps;<br>        HDC hdc = BeginPaint(hwnd, &amp;ps);<br>        <br>        // 每帧手动绘制所有内容<br>        draw_button(hdc, 50, 50, 100, 30, <span class="hljs-string">&quot;Click&quot;</span>);<br>        <br>        EndPaint(hwnd, &amp;ps);<br>    &#125;<br>&#125;<br>现代自绘 (Win32 + Direct2D)<br>// 直接调用 DirectX 接口<br>ID2D1HwndRenderTarget* pRenderTarget;<br>ID2D1SolidColorBrush* pBrush;<br>void <span class="hljs-function"><span class="hljs-title">Render</span></span>() &#123;<br>    pRenderTarget-&gt;BeginDraw();<br>    pRenderTarget-&gt;Clear(D2D1::ColorF(D2D1::ColorF::White));<br>    <br>    // 直接绘制到 GPU<br>    pRenderTarget-&gt;FillRectangle(<br>        D2D1::RectF(50, 50, 150, 80),<br>        pBrush<br>    );<br>    <br>    pRenderTarget-&gt;EndDraw();<br>&#125;<br>---<br>性能对比<br>┌──────────────────────────────────────────────────────────┐<br>│  渲染方式对比 (绘制 1000 个矩形)                          │<br>├──────────────────────────────────────────────────────────┤<br>│  方案              │  FPS    │  内存    │  开发成本     │<br>├──────────────────────────────────────────────────────────┤<br>│  WPF              │  60     │  100MB+ │  低           │<br>│  Avalonia         │  60     │  80MB+  │  低           │<br>│  Qt               │  60     │  60MB+  │  中           │<br>│  Electron         │  60     │  200MB+ │  低           │<br>│  自绘 (GDI)       │  30-60  │  20MB   │  高           │<br>│  自绘 (Direct2D)  │  60+    │  30MB   │  很高         │<br>│  自绘 (OpenGL)    │  60+    │  25MB   │  很高         │<br>└──────────────────────────────────────────────────────────┘<br>---<br>总结<br>问题	答案<br>窗口程序都调用渲染引擎吗？	是，只是引擎抽象层次不同<br>WPF/Avalonia 是怎么做的？	封装了 DirectX/OpenGL，提供高级 API<br>自绘引擎是什么？	跳过 UI 框架，直接调用图形 API<br>自绘=直接调 GPU 吗？	是，但也可以通过 GDI 等 CPU 渲染<br>哪个性能最好？	自绘 (DirectX/OpenGL) &gt; 框架 &gt; Electron<br>核心结论：<br>- 框架 = 帮你管理渲染细节，开发快，有 overhead<br>- 自绘 = 自己控制每一像素，性能高，开发慢<br></code></pre></td></tr></table></figure>
